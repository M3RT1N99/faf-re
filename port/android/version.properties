# Version of the Android APK (scripts/port/build_android.ps1 reads this file).
#
# versionName is the user-visible version and part of the APK file name. It is
# also what the launcher writes as ClientVersion into fa_path.lua.
#
# versionCode is not stored here: the build uses `git rev-list --count HEAD`,
# which only grows on this branch, so every build of a newer commit installs
# over an older one without bumping a number by hand.
versionName=0.4.0
