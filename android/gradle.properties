# The app's user-visible version (versionCode is `git rev-list --count HEAD`).
fafVersionName=0.7.0

# Where the engine's Android builds are, relative to the repository root: the presets with the
# client (android/CLIENT_PLAN.md) in their own directories, e.g.
#   cmake --preset android-arm64-release -B build/android-arm64-client -DFAF_ANDROID_CLIENT=ON
#   cmake --build build/android-arm64-client --target headless faf_sim_math_tests fafgalsmoke
fafNativeDir.arm64-v8a=build/android-arm64-client
fafNativeDir.x86_64=build/android-x64-client
# ABIs in the APK: phones need arm64-v8a; add x86_64 for the emulator (-PfafAbis=arm64-v8a,x86_64).
fafAbis=arm64-v8a

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
