# The app's user-visible version (versionCode is `git rev-list --count HEAD`).
fafVersionName=0.6.1

# Where the engine's Android builds are: the CMake presets' binary directories, relative to
# the repository root (cmake --build --preset android-arm64-release builds them).
fafNativeDir.arm64-v8a=build/android-arm64-release
fafNativeDir.x86_64=build/android-x64-release
# ABIs in the APK: phones need arm64-v8a; add x86_64 for the emulator (-PfafAbis=arm64-v8a,x86_64).
fafAbis=arm64-v8a

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
