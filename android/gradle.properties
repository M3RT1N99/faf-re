# The app's user-visible version (versionCode is `git rev-list --count HEAD`).
fafVersionName=0.10.0

# Where the Android native build (android/native) puts the programs and libraries the app
# packages, relative to the repository root. From android/native:
#   cmake --preset android-arm64 && cmake --build --preset android-arm64
fafNativeDir.arm64-v8a=build/android-arm64/bin
fafNativeDir.x86_64=build/android-x64/bin
# ABIs in the APK: phones need arm64-v8a; add x86_64 for the emulator (-PfafAbis=arm64-v8a,x86_64).
fafAbis=arm64-v8a

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
